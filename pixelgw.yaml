openapi: "3.0.0"
info:
  version: 1.0.0
  title: Pixel Gateway
  description: API to manage PixelMatrix servier and displays
servers:
  - url: /api
paths:
  /applets:
    get:
      summary: List available apps
      description: Return all the configured apps
      operationId: getApplets
      parameters:
        - name: id
          in: query
          description: Id to filter by
          schema:
            type: string
      responses:
        '200':
          description: App response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/App'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
  /applets/{id}:
    get:
      summary: Get the details of an app
      description: Returns an app by id
      operationId: getAppletByID
      parameters:
        - name: id
          in: path
          description: ID of the app to fetch
          required: true
          schema:
            type: string
      responses:
        '200':
          description: app response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
  /applets/{id}/render:
    get:
      summary: Render an applet with config
      description: Renders an applet with the provided configuration and returns a WebP image
      operationId: renderApplet
      parameters:
        - name: id
          in: path
          description: ID of the app to render
          required: true
          schema:
            type: string
        - name: config
          in: query
          description: JSON configuration for the applet
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Rendered WebP image
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
  /locations:
    get:
      summary: Search locations
      description: Search for locations by name for location picker fields
      operationId: searchLocations
      parameters:
        - name: q
          in: query
          description: Search query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Location search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
  /locations/{placeId}:
    get:
      summary: Get location by place ID
      description: Get full location details by place ID
      operationId: getLocationByPlaceID
      parameters:
        - name: placeId
          in: path
          description: Place ID of the location
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Location details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
  /channels:
    get:
      description: Returns the list of channels.
      operationId: getChannels
      responses:
        '200':
          description: Channel response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelSummary'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
    post:
      description: Create a new channel
      operationId: createChannel
      requestBody:
        description: New channel
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelSummary'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelDetail'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
  /channels/{uuid}:
    get:
      description: Get the details of a channel
      operationId: findChannelByUUID
      parameters:
        - name: uuid
          in: path
          description: UUID of the channel to fetch
          required: true
          schema:
            type: string
            format: uuid
          x-go-name: UUID
      responses:
        '200':
          description: Channel response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelDetail'
            image/webp:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
    patch:
      description: Update a channel
      operationId: patchChannel
      parameters:
        - name: uuid
          in: path
          description: UUID of the channel to update
          required: true
          schema:
            type: string
            format: uuid
          x-go-name: UUID
      requestBody:
        description: Channel attributes to update
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Channel name
                comment:
                  type: string
                  description: Channel description
      responses:
        '200':
          description: Channel updated successfully
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
    delete:
      description: Delete a channel
      operationId: deleteChannel
      parameters:
        - name: uuid
          in: path
          description: UUID of the channel to delete
          required: true
          schema:
            type: string
            format: uuid
          x-go-name: UUID
      responses:
        '200':
          description: Channel deleted successfully
        '409':
          description: Channel has subscribers and cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
  /channels/{uuid}/push:
    post:
      summary: Push temporary content to channel
      description: Push a WebP image or render an applet and display it temporarily on all devices subscribed to this channel
      operationId: pushChannelContent
      parameters:
        - name: uuid
          in: path
          description: UUID of the channel
          required: true
          schema:
            type: string
            format: uuid
          x-go-name: UUID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: WebP image (max 128KB, must be 64x32)
                duration:
                  type: integer
                  description: Display duration in seconds (default 15, 0 for indefinite)
                  default: 15
          application/json:
            schema:
              $ref: '#/components/schemas/PushAppletRequest'
      responses:
        '200':
          description: Content pushed successfully
        '400':
          description: Bad request (invalid image format, size, dimensions, or applet)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
    delete:
      summary: Clear channel push override
      description: Clear any active push override on a channel and resume normal render loop immediately
      operationId: clearChannelPush
      parameters:
        - name: uuid
          in: path
          description: UUID of the channel
          required: true
          schema:
            type: string
            format: uuid
          x-go-name: UUID
      responses:
        '200':
          description: Override cleared (or no override was active)
        '404':
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
  /channels/{channelUUID}/applets:
    post:
      description: Create a new applet instance
      operationId: createChannelApplet
      parameters:
        - name: channelUUID
          in: path
          description: UUID of the channel
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Applet
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppInstanceSummary'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInstanceDetail'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
  /channels/{channelUUID}/applets/{appletUUID}:
    delete:
      description: Delete an applet instance
      operationId: deleteChannelApplet
      parameters:
        - name: channelUUID
          in: path
          description: UUID of the channel
          required: true
          schema:
            type: string
            format: uuid
        - name: appletUUID
          in: path
          description: UUID of the applet instance
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ok
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
    patch:
      description: Modify an applet instance
      operationId: patchChannelApplet
      parameters:
        - name: channelUUID
          in: path
          description: UUID of the channel
          required: true
          schema:
            type: string
            format: uuid
        - name: appletUUID
          in: path
          description: UUID of the applet instance
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Channel attributes
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idx:
                  type: integer
                  description: App position
                config:
                  type: string
                  format: json
                  description: Applet configuration
      responses:
        '200':
          description: Ok
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
  /devices:
    get:
      summary: Get configured devices
      operationId: getDevices
      parameters:
        - name: fields
          in: query
          description: Comma-separated list of fields to include, or * for all fields. Default excludes device-info.
          schema:
            type: string
      responses:
        '200':
          description: Device response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceSummary'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
  /devices/{uuid}:
    get:
      description: Get the details of a device
      operationId: getDeviceByUUID
      parameters:
        - name: uuid
          in: path
          description: ID of the device
          required: true
          schema:
            type: string
            format: uuid
          x-go-name: UUID
        - name: fields
          in: query
          description: Comma-separated list of fields to include, or * for all fields. Default excludes device-info.
          schema:
            type: string
      responses:
        '200':
          description: Device response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSummary'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
    patch:
      description: Modify a device
      operationId: patchDevice
      parameters:
        - name: uuid
          in: path
          description: UUID of the device
          required: true
          schema:
            type: string
            format: uuid
          x-go-name: UUID
      requestBody:
        description: Device attributes
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Device name
                channel:
                  $ref: '#/components/schemas/ChannelRef'
      responses:
        '200':
          description: Ok
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
    delete:
      description: Delete a device
      operationId: deleteDevice
      parameters:
        - name: uuid
          in: path
          description: UUID of the device to delete
          required: true
          schema:
            type: string
            format: uuid
          x-go-name: UUID
      responses:
        '200':
          description: Device deleted successfully
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
  /devices/{uuid}/push:
    post:
      summary: Push temporary content to device
      description: Push a WebP image or render an applet and display it temporarily on a specific device, overriding its channel subscription
      operationId: pushDeviceContent
      parameters:
        - name: uuid
          in: path
          description: UUID of the device
          required: true
          schema:
            type: string
            format: uuid
          x-go-name: UUID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: WebP image (max 128KB, must be 64x32)
                duration:
                  type: integer
                  description: Display duration in seconds (default 15, 0 for indefinite)
                  default: 15
          application/json:
            schema:
              $ref: '#/components/schemas/PushAppletRequest'
      responses:
        '200':
          description: Content pushed successfully
        '400':
          description: Bad request (invalid image format, size, dimensions, or applet)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Device not currently connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
    delete:
      summary: Clear device push override
      description: Clear any active push override on a device and return to channel content immediately
      operationId: clearDevicePush
      parameters:
        - name: uuid
          in: path
          description: UUID of the device
          required: true
          schema:
            type: string
            format: uuid
          x-go-name: UUID
      responses:
        '200':
          description: Override cleared (or no override was active)
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Device not currently connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
  /sessions:
    get:
      summary: Get connected sessions
      operationId: getSessions
      responses:
        '200':
          description: Session response
          content:
           application/json:
             schema:
               type: array
               items:
                 $ref: '#/components/schemas/SessionSummary'
        default: 
          $ref: '#/components/responses/DefaultErrorResponse'
components:
  schemas:
    App:
      type: object
      required:
        - id
        - name
        - summary
        - description
        - author
      properties:
        id:
          type: string
          description: Unique ID of the app
        name:
          type: string
          description: Name of the app
        summary:
          type: string
          description: Short summary of the app
        description:
          type: string
          desciption: Long form of what this applet does
        author:
          type: string
          description: Author of the app
        schema:
           $ref: '#/components/schemas/Schema'
    Location:
      type: object
      required:
        - place_id
        - description
        - locality
        - lat
        - lng
        - timezone
      properties:
        place_id:
          type: string
          description: Unique place identifier
          x-go-name: PlaceID
        description:
          type: string
          description: Full location description (e.g. "Brooklyn, NY, USA")
        locality:
          type: string
          description: City/locality name
        lat:
          type: string
          description: Latitude
        lng:
          type: string
          description: Longitude
        timezone:
          type: string
          description: IANA timezone identifier (e.g. "America/New_York")
    AppInstanceSummary:
      type: object
      properties:
        app-id:
          type: string
          description: Applet ID
          x-go-name: AppID
        idx:
          type: integer
          description: App position
        config:
          type: string
          format: json
          description: Applet configuration
      required:
        - app-id
    AppInstanceDetail:
      type: object
      allOf:
        - $ref: '#/components/schemas/AppInstanceSummary'
        - properties:
            uuid:
              type: string
              format: uuid
              x-go-name: UUID
              description: App instance UUID
    ChannelRef:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: UUID of the channel
          x-go-name: UUID
        name:
          type: string
          description: Name of the channel
    ChannelSummary:
      type: object
      required:
        - name
      properties:
        uuid:
          type: string
          format: uuid
          description: UUID of the channel
          x-go-name: UUID
          readOnly: true
        name:
          type: string
          description: Name of the channel
        comment:
          type: string
          description: Comment for the channel
    ChannelDetail:
      type: object
      allOf:
        - $ref: '#/components/schemas/ChannelSummary'
        - properties:
            applets:
              type: array
              items:
               $ref: '#/components/schemas/AppInstanceDetail'
            subscribers:
              type: array
              items:
                $ref: '#/components/schemas/DeviceRef'
    DeviceRef:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: UUID of the device
          x-go-name: UUID
        name:
          type: string
          description: Name of the channel
    DeviceSummary:
      type: object
      allOf:
        - $ref: '#/components/schemas/DeviceRef'
        - properties:
            channel:
              $ref: '#/components/schemas/ChannelRef'
            connected:
              type: boolean
              description: Whether the device is currently connected
            current-ip:
              type: string
              description: Current IP address if connected
              x-go-name: CurrentIP
            last-ip:
              type: string
              description: Last known IP address
              x-go-name: LastIP
            last-connect-time:
              type: string
              format: date-time
              description: Last connection timestamp
              x-go-name: LastConnectTime
            last-disconnect-time:
              type: string
              format: date-time
              description: Last disconnection timestamp
              x-go-name: LastDisconnectTime
            device-info:
              type: object
              additionalProperties: true
              description: Device information payload (firmware version, etc.)
              x-go-name: DeviceInfo
            device-info-updated:
              type: string
              format: date-time
              description: When device info was last updated
              x-go-name: DeviceInfoUpdated
    SessionSummary:
      type: object
      properties:
        id:
          type: integer
          format: uint32
          description: Session ID
          x-go-name: ID
        remote-addr:
          type: string
          description: Remote IP address
          x-ogen-name: RemoteAddr
        channel:
          $ref: '#/components/schemas/ChannelRef'
        device:
          $ref: '#/components/schemas/DeviceRef'
    Schema:
      type: object
      x-go-type: schema.Schema
      x-go-type-import:
        name: schema
        path: tidbyt.dev/pixlet/schema
      required:
        - version
      properties:
        version:
          type: string
          description: Version
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SchemaField'
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    SchemaField:
      type: object
      x-go-type: schema.SchemaField
      x-go-type-import:
        name: schema
        path: tidbyt.dev/pixlet/schema
      properties:
        type:
          type: string
          description: type
        id:
          type: string
          description: id
        name:
          type: string
          description: name
        icon:
          type: string
          description: icon
        visibility:
          $ref: '#/components/schemas/SchemaVisibility'
        default:
          type: string
          description: default value
        options:
          type: array
          items:
            $ref: '#/components/schemas/SchemaOption'
    SchemaVisibility:
      type: object
      x-go-type: schema.SchemaVisibility
      x-go-type-import:
        name: schema
        path: tidbyt.dev/pixlet/schema
      required:
        - type
        - condition
        - variable
      properties:
        type:
          type: string
          description: type
        condition:
          type: string
          description: condition
        variable:
          type: string
          description: variable
        value:
          type: string
          description: value
    SchemaOption:
      type: object
      x-go-type: schema.SchemaOption
      x-go-type-import:
        name: schema
        path: tidbyt.dev/pixlet/schema
      required:
        - text
        - value
      properties:
        display:
          type: string
          description: display
        text:
          type: string
          description: the same as display
        value:
          type: string
          description: value
    Notification:
      type: object
      x-go-type: schema.Notification
      x-go-type-import:
        name: schema
        path: tidbyt.dev/pixlet/schema
      allOf:
       - $ref: '#/components/schemas/SchemaField'
    PushAppletRequest:
      type: object
      required:
        - applet
      properties:
        applet:
          type: string
          description: Applet ID from catalog
        config:
          type: object
          additionalProperties: true
          description: Applet configuration
        duration:
          type: integer
          description: Display duration in seconds (default 15, 0 for indefinite)
          default: 15
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
        message:
          type: string
          description: Error message
  responses:
    DefaultErrorResponse:
      description: Unknown error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

